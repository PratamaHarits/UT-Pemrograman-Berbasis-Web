<!doctype html>
<html>
  <head>
    <title>Belajar DOM</title>
  </head>
  <body>
    <h2 id="nama"></h2>
    <button onclick="ubahTampilan()">Tampilkan Nama</button>

    <script>
      function ubahTampilan() {
        document.getElementById("nama").innerHTML = "Muhammad Harits Pratama";
        document.getElementById("nama").style.color = "blue";
      }
    </script>

</html>
