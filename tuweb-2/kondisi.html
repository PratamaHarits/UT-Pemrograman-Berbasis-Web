<!doctype html>
<html>
  <head>
    <title>Conditional Vue</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <h2 v-if="nilai >= 85">Nilai A</h2>
      <h2 v-else-if="nilai >= 70">Nilai B</h2>
      <h2 v-else-if="nilai >= 60">Nilai C</h2>
      <h2 v-else>Nilai D</h2>
    </div>

    <script>
      const app = Vue.createApp({
        data() {
          return {
            nilai: 40,
          };
        },
      });

      app.mount("#app");
    </script>
  </body>
</html>
