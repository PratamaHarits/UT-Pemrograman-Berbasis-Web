<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <h1 v-if="nilai >= 80">NILAI A</h1>
      <h1 v-else-if="nilai >= 70">NILAI B</h1>
      <h1 v-else-if="nilai >= 60">NILAI C</h1>
      <h1 v-else>NILAI D</h1>
    </div>

    <script>
      const app = Vue.crateApp({
        data() {
          return {
            nilai: 65,
          };
        },
      });
      app.mount("#app");
    </script>
  </body>
</html>
