<!doctype html>
<html>
  <head>
    <title>Input Dinamis</title>

    <style>
      input {
        padding: 10px;
        width: 250px;
        border: 1px solid #ccc;
        background-color: white;
        transition: 0.3s;
      }

      input:not(:placeholder-shown) {
        background-color: lightblue;
      }
    </style>
  </head>
  <body>
    <input type="text" placeholder="Ketik di sini" />
  </body>
</html>
