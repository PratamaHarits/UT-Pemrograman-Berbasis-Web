<!doctype html>
<html>
  <head>
    <title>Contoh Canvas</title>
  </head>
  <body>
    <canvas
      id="myCanvas"
      width="500"
      height="300"
      style="border: 1px solid black"
    ></canvas>

    <script>
      let canvas = document.getElementById("myCanvas");
      let ctx = canvas.getContext("2d");

      // Persegi panjang
      ctx.fillStyle = "blue";
      ctx.fillRect(20, 20, 120, 80);

      // Garis
      ctx.beginPath();
      ctx.moveTo(180, 20);
      ctx.lineTo(350, 100);
      ctx.stroke();

      // Lingkaran
      ctx.beginPath();
      ctx.arc(250, 180, 50, 0, 2 * Math.PI);
      ctx.stroke();
    </script>
  </body>
</html>
