<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <input v-focus />
    </div>

    <script>
      const app = Vue.createApp({});
      app.directive("focus", {
        mounted(el) {
          el.focus();
        },
      });
      app.mount("#app");
    </script>
  </body>
</html>
